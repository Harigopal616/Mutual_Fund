<!DOCTYPE html>
<html>

<head>
    <title>Mutual Fund Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: Arial;
            margin: 30px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th,
        td {
            border: 1px solid black;
            padding: 10px;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>

</head>

<body>

    <h1>Mutual Fund Dashboard</h1>
<div class="row mb-3">

    <div class="col-md-3">
        <label>Start Date</label>
        <input type="date"
               id="startDate"
               class="form-control">
    </div>

    <div class="col-md-3">
        <label>End Date</label>
        <input type="date"
               id="endDate"
               class="form-control">
    </div>

</div>
    <button class="btn btn-primary"
        onclick="loadData(); loadInvestors(); loadInvestorFundSummary(); loadFundPurchaseSummary();">
    Apply Filter
</button>

    <br><br>

    <div class="card">

    <div class="card-header">
        Mutual Fund Summary
    </div>

    <div class="card-body">

        <table class="table table-bordered">

            <thead>

                <tr>
                    <th>Scheme</th>
                    <th>Total Amount</th>
                    <th>Total Units</th>
                    <th>Average NAV</th>
                </tr>

            </thead>

            <tbody id="tableBody">

            </tbody>

        </table>

    </div>

</div>
<br>

<div class="card">

    <div class="card-header">
        Investor List
    </div>

    <div class="card-body">

        <table class="table table-bordered">

            <thead>
                <tr>
                    <th>PAN</th>
                    <th>Investor Name</th>
                    <th>Total Amount</th>
                </tr>
            </thead>

            <tbody id="investorBody">

            </tbody>

        </table>

    </div>

</div>
<br>

<div class="card">

    <div class="card-header">
        Investor Fund Summary
    </div>

    <div class="card-body">

        <table class="table table-bordered">

            <thead>
                <tr>
                    <th>Investor Name</th>
                    <th>Scheme</th>
                    <th>Amount</th>
                    <th>Units</th>
                </tr>
            </thead>

            <tbody id="investorFundBody">

            </tbody>

        </table>

    </div>

</div>

<br>

<div class="card">

    <div class="card-header">
        Fund Purchase Summary
    </div>

    <div class="card-body">

        <table class="table table-bordered">

            <thead>

                <tr>
                    <th>Scheme</th>
                    <th>Amount</th>
                    <th>Units</th>
                </tr>

            </thead>

            <tbody id="fundPurchaseBody">

            </tbody>

        </table>

    </div>

</div>

    <script>

        async function loadData() {

    const startDate =
        document.getElementById("startDate").value;

    const endDate =
        document.getElementById("endDate").value;

    const response =
        await fetch(
            `/api/mutual-fund-summary?start_date=${startDate}&end_date=${endDate}`
        );

    const data =
        await response.json();

    let rows = "";

    data.forEach(item => {

        rows += `
        <tr>
            <td>${item.SCHEME}</td>
            <td>${item.AMOUNT.toFixed(2)}</td>
            <td>${item.UNITS.toFixed(2)}</td>
            <td>${item.PURPRICE.toFixed(2)}</td>
        </tr>
        `;

    });

    document.getElementById("tableBody").innerHTML = rows;
}
        async function loadInvestors() {

    const startDate =
    document.getElementById("startDate").value;

const endDate =
    document.getElementById("endDate").value;

const response =
    await fetch(
        `/api/investors?start_date=${startDate}&end_date=${endDate}`
    );
    const data =
        await response.json();

    let rows = "";

    data.forEach(item => {

        rows += `
        <tr>
            <td>${item.PAN}</td>
            <td>${item.INV_NAME}</td>
            <td>${item.AMOUNT.toFixed(2)}</td>
        </tr>
        `;

    });

    document.getElementById("investorBody")
        .innerHTML = rows;
}
async function loadInvestorFundSummary() {

    const startDate =
        document.getElementById("startDate").value;

    const endDate =
        document.getElementById("endDate").value;

    const response =
        await fetch(
            `/api/investor-fund-summary?start_date=${startDate}&end_date=${endDate}`
        );

    const data =
        await response.json();

    let rows = "";

    data.forEach(item => {

        rows += `
        <tr>
            <td>${item.INV_NAME}</td>
            <td>${item.SCHEME}</td>
            <td>${item.AMOUNT.toFixed(2)}</td>
            <td>${item.UNITS.toFixed(2)}</td>
        </tr>
        `;

    });

    document.getElementById("investorFundBody")
        .innerHTML = rows;
}
async function loadFundPurchaseSummary() {

    const startDate =
        document.getElementById("startDate").value;

    const endDate =
        document.getElementById("endDate").value;

    const response =
        await fetch(
            `/api/fund-purchase-summary?start_date=${startDate}&end_date=${endDate}`
        );

    const data =
        await response.json();

    let rows = "";

    data.forEach(item => {

        rows += `
        <tr>
            <td>${item.SCHEME}</td>
            <td>${item.AMOUNT.toFixed(2)}</td>
            <td>${item.UNITS.toFixed(2)}</td>
        </tr>
        `;

    });

    document.getElementById("fundPurchaseBody")
        .innerHTML = rows;
}


    </script>

</body>

</html>
